name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for testing without cutting a real tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for artifact filenames (used only when no tag is present)'
        required: false
        default: 'manual'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run layout and installer tests
        run: |
          python3 tests/test_coverage.py
          python3 tests/test_install.py

      - name: Compute version label
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version || 'manual' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${REQUESTED_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build both layout packages
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          for variant in qwertz qwerty; do
            scripts/build-dmg.sh "$RELEASE_VERSION" "$variant"
            scripts/build-zip.sh "$RELEASE_VERSION" "$variant"
          done

      - name: Verify all packages and generate checksums
        run: |
          for package in dist/*.dmg; do hdiutil verify "$package"; done
          for package in dist/*.zip; do unzip -tq "$package"; done
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS)

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Kazakh-layouts-${{ steps.ver.outputs.value }}
          path: dist/*

      - name: Create release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
